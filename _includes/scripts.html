<script src="{{ base_path }}/assets/js/main.min.js"></script>

{% if page.invisible_cities %}
  <script src="{{ '/assets/js/invisible-cities.js' | relative_url }}" defer></script>
{% endif %}

{% if page.layout == 'travel-journey' %}
  <script src="{{ '/assets/vendor/leaflet/leaflet.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/travel-journey.js' | relative_url }}"></script>
{% endif %}

{% if site.travel_notes.form_id %}
  {% if page.collection == 'travel' or page.leave_note %}
    <script src="{{ '/assets/vendor/formspree/formspree-ajax-1.1.5.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/travel-log-footer.js' | relative_url }}"></script>
  {% endif %}
{% endif %}
